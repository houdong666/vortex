<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Prefetch将请求、响应缓存和命令消费解耦</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">EXPERIMENT 6</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="why"><rect x="56" y="116" width="292" height="492" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><use data-icon="chunk-filled/layers" x="84" y="146" width="42" height="42" fill="#F59E0B"/><text x="84" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">为什么做？</text><text x="84" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937"><tspan x="84" y="252">原路径必须等待当前CL返回</tspan><tspan x="84" y="280">并消费结束，才请求下一CL。</tspan><tspan x="84" y="308">Host AXI延迟被完全暴露。</tspan></text><text x="84" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#F59E0B">目标：让等待与解析重叠</text></g>
  <g id="pipeline"><g id="prefetch-stage-0"><rect x="392" y="152" width="222" height="154" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/><use data-icon="chunk-filled/arrow-right" x="416" y="176" width="34" height="34" fill="#1565C0"/><text x="416" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1565C0">请求侧</text><text x="416" y="262" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">fetch_head_r</text><text x="416" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">AR握手 +64B</text><line x1="614" y1="229" x2="656" y2="229" stroke="#0B1F3A" stroke-width="3"/><polygon points="656,229 644,222 644,236" fill="#0B1F3A"/></g><g id="prefetch-stage-1"><rect x="662" y="152" width="222" height="154" rx="12" fill="#FFFFFF" stroke="#00A6A6" stroke-width="1"/><use data-icon="chunk-filled/database" x="686" y="176" width="34" height="34" fill="#00A6A6"/><text x="686" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#00A6A6">响应侧</text><text x="686" y="262" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">CL FIFO[2]</text><text x="686" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">R数据有序入队</text><line x1="884" y1="229" x2="926" y2="229" stroke="#0B1F3A" stroke-width="3"/><polygon points="926,229 914,222 914,236" fill="#0B1F3A"/></g><g id="prefetch-stage-2"><rect x="932" y="152" width="222" height="154" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><use data-icon="chunk-filled/code" x="956" y="176" width="34" height="34" fill="#F59E0B"/><text x="956" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#F59E0B">消费侧</text><text x="956" y="262" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">head_r</text><text x="956" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">行消费完 +64B</text></g></g>
  <g id="invariant"><rect x="392" y="352" width="762" height="108" rx="12" fill="#FFFFFF" stroke="#D64545" stroke-width="1"/><text x="420" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#D64545">容量不变量</text><text x="420" y="430" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="700" fill="#0B1F3A">fifo_count + request_count &lt; PREFETCH_DEPTH</text></g>
  <g id="meaning"><rect x="392" y="486" width="762" height="122" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="420" y="525" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#00A6A6">关键含义</text><text x="420" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">在途请求提前占用FIFO容量，保证每个AXI响应到达时都有可写槽位。</text><text x="420" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">只支持深度1/2和有序响应，不引入重排缓冲或复杂AXI ID。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">代码：hw/rtl/cp/VX_cp_fetch.sv</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">10 / 15</text></g>
</svg>
