  </g><text x="540" y="500" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">ENABLE_NOP_FAST_PATH</text><text x="486" y="544" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">仅在参数开启且opcode为NOP时绕过DECODE；其他命令保持原状态机。</text><text x="486" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#D64545">默认值保持0：未经整机时序联调，不改变生产配置。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">代码：hw/rtl/cp/VX_cp_engine.sv</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">06 / 15</text></g>
