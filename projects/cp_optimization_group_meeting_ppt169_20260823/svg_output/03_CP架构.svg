<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">CP位于Host控制与GPU执行资源之间</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">ARCHITECTURE</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="takeaway"><rect x="56" y="104" width="1168" height="50" rx="8" fill="#F59E0B" fill-opacity="0.10"/><text x="80" y="136" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A">CP前端的等待会直接限制Kernel启动、数据搬运和寄存器配置效率</text></g>
  <g id="host-layer"><rect x="56" y="180" width="1168" height="94" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/><use data-icon="chunk-filled/box" x="82" y="205" width="42" height="42" fill="#1565C0"/><text x="140" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1565C0">Host 控制层</text><text x="140" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">AXI4-Lite → VX_cp_axil_regfile → Queue State / Ring Base / Tail</text></g>
  <g id="cpe-layer"><rect x="56" y="296" width="1168" height="142" rx="12" fill="#FFFFFF" stroke="#00A6A6" stroke-width="1"/><text x="82" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#00A6A6">每个Queue的CPE数据路径</text><rect x="330" y="345" width="210" height="62" rx="8" fill="#00A6A6" fill-opacity="0.10"/><text x="435" y="383" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">VX_cp_fetch</text><line x1="540" y1="376" x2="605" y2="376" stroke="#00A6A6" stroke-width="3"/><polygon points="605,376 593,369 593,383" fill="#00A6A6"/><rect x="605" y="345" width="210" height="62" rx="8" fill="#00A6A6" fill-opacity="0.10"/><text x="710" y="383" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">VX_cp_unpack</text><line x1="815" y1="376" x2="880" y2="376" stroke="#00A6A6" stroke-width="3"/><polygon points="880,376 868,369 868,383" fill="#00A6A6"/><rect x="880" y="345" width="210" height="62" rx="8" fill="#00A6A6" fill-opacity="0.10"/><text x="985" y="383" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#0B1F3A">VX_cp_engine</text></g>
  <g id="resource-layer"><rect x="56" y="460" width="1168" height="150" rx="12" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1"/><text x="82" y="498" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">共享执行与完成层</text><rect x="82" y="522" width="190" height="58" rx="8" fill="#0B1F3A" fill-opacity="0.08"/><text x="177" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">KMU / Launch</text><rect x="306" y="522" width="190" height="58" rx="8" fill="#0B1F3A" fill-opacity="0.08"/><text x="401" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">DMA</text><rect x="530" y="522" width="190" height="58" rx="8" fill="#0B1F3A" fill-opacity="0.08"/><text x="625" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">DCR</text><rect x="754" y="522" width="190" height="58" rx="8" fill="#0B1F3A" fill-opacity="0.08"/><text x="849" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">Event</text><rect x="978" y="522" width="190" height="58" rx="8" fill="#F59E0B" fill-opacity="0.16"/><text x="1073" y="558" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F59E0B">Completion</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：Vortex CP RTL架构与实验指导书</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">03 / 15</text></g>
</svg>
