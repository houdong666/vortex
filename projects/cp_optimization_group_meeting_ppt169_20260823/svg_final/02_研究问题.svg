  </g><text x="216" y="571" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">哪些结果值得继续？</text><text x="216" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">把吞吐收益与面积、Fmax、适用负载一起做集成决策。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：Vortex CP 实验文档与仓库实测</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">02 / 15</text></g>
