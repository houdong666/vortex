<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Fast Path删除NOP路径中的一周期固定开销</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">EXPERIMENT 4</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="why"><rect x="56" y="112" width="360" height="492" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><use data-icon="chunk-filled/bolt" x="84" y="142" width="44" height="44" fill="#F59E0B"/><text x="84" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">为什么做？</text><text x="84" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2937"><tspan x="84" y="252">NOP不申请KMU、DMA、DCR</tspan><tspan x="84" y="282">或Event资源，DECODE只承担</tspan><tspan x="84" y="312">固定的一周期状态跳转。</tspan></text><text x="84" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#F59E0B">机会：直接退休简单命令</text></g>
  <g id="paths"><text x="460" y="146" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B677A">BASELINE</text><rect x="460" y="172" width="170" height="74" rx="10" fill="#1565C0" fill-opacity="0.14" stroke="#1565C0"/><text x="545" y="216" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">IDLE</text><line x1="630" y1="209" x2="680" y2="209" stroke="#1565C0" stroke-width="3"/><polygon points="680,209 668,202 668,216" fill="#1565C0"/><rect x="686" y="172" width="170" height="74" rx="10" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B"/><text x="771" y="216" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">DECODE</text><line x1="856" y1="209" x2="906" y2="209" stroke="#1565C0" stroke-width="3"/><polygon points="906,209 894,202 894,216" fill="#1565C0"/><rect x="912" y="172" width="170" height="74" rx="10" fill="#1565C0" fill-opacity="0.14" stroke="#1565C0"/><text x="997" y="216" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">RETIRE</text><text x="460" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#00A6A6">FAST PATH</text><rect x="460" y="338" width="170" height="74" rx="10" fill="#00A6A6" fill-opacity="0.14" stroke="#00A6A6"/><text x="545" y="382" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">IDLE</text><line x1="630" y1="375" x2="906" y2="375" stroke="#00A6A6" stroke-width="4"/><polygon points="906,375 892,367 892,383" fill="#00A6A6"/><rect x="906" y="338" width="170" height="74" rx="10" fill="#00A6A6" fill-opacity="0.14" stroke="#00A6A6"/><text x="991" y="382" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">RETIRE</text></g>
  <g id="implementation"><rect x="460" y="450" width="764" height="154" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><use data-icon="chunk-filled/code" x="486" y="480" width="38" height="38" fill="#1565C0"/><text x="540" y="500" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">ENABLE_NOP_FAST_PATH</text><text x="486" y="544" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">仅在参数开启且opcode为NOP时绕过DECODE；其他命令保持原状态机。</text><text x="486" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#D64545">默认值保持0：未经整机时序联调，不改变生产配置。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">代码：hw/rtl/cp/VX_cp_engine.sv</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">06 / 15</text></g>
</svg>
