<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Packing让64B缓存行承载多条短命令</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">EXPERIMENT 5</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="waste"><rect x="56" y="116" width="300" height="492" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><use data-icon="chunk-filled/database" x="84" y="146" width="42" height="42" fill="#F59E0B"/><text x="84" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">为什么做？</text><text x="84" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2937"><tspan x="84" y="252">DCR_WRITE仅占20B，</tspan><tspan x="84" y="282">若独占64B缓存行，</tspan><tspan x="84" y="312">读取带宽浪费68.75%。</tspan></text><text x="84" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#F59E0B">20 / 64 B</text></g>
