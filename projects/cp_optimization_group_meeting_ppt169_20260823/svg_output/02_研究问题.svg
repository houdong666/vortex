<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">这项研究要回答四个问题</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">RESEARCH QUESTIONS</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="thesis"><rect x="56" y="104" width="1168" height="54" rx="8" fill="#1565C0" fill-opacity="0.08"/><text x="80" y="139" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A">优化不是“改RTL”，而是建立瓶颈 → 机制 → 证据 → 决策的完整闭环</text></g>
  <g id="question-1"><rect x="56" y="184" width="1168" height="92" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="82" y="241" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#1565C0">01</text><use data-icon="chunk-filled/target" x="152" y="210" width="40" height="40" fill="#1565C0"/><text x="216" y="223" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">为什么优化CP？</text><text x="216" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">CP连接Host命令与GPU执行资源，前端停顿会沿命令链传播。</text></g><g id="question-2"><rect x="56" y="300" width="1168" height="92" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="82" y="357" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#00A6A6">02</text><use data-icon="chunk-filled/gauge-high" x="152" y="326" width="40" height="40" fill="#00A6A6"/><text x="216" y="339" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">瓶颈究竟在哪里？</text><text x="216" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">区分固定状态开销、Fetch带宽浪费与Host AXI等待。</text></g><g id="question-3"><rect x="56" y="416" width="1168" height="92" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="82" y="473" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#138A5B">03</text><use data-icon="chunk-filled/shield-check" x="152" y="442" width="40" height="40" fill="#138A5B"/><text x="216" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">如何证明没有副作用？</text><text x="216" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">用顺序、seqnum、Ring wrap、边界与压力回归守住语义。</text></g><g id="question-4"><rect x="56" y="532" width="1168" height="92" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="82" y="589" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#F59E0B">04</text><use data-icon="chunk-filled/git-branch" x="152" y="558" width="40" height="40" fill="#F59E0B"/><text x="216" y="571" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">哪些结果值得继续？</text><text x="216" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">把吞吐收益与面积、Fmax、适用负载一起做集成决策。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：Vortex CP 实验文档与仓库实测</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">02 / 15</text></g>
</svg>
