  </g><text x="216" y="223" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">为什么优化CP？</text><text x="216" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">CP连接Host命令与GPU执行资源，前端停顿会沿命令链传播。</text></g><g id="question-2"><path fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1" d="M68,300 H1212 A12,12 0 0 1 1224,312 V380 A12,12 0 0 1 1212,392 H68 A12,12 0 0 1 56,380 V312 A12,12 0 0 1 68,300 Z" /><text x="82" y="357" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#00A6A6">02</text>
