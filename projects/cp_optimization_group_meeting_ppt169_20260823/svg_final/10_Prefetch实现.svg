  <g id="meaning"><path fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1" d="M404,486 H1142 A12,12 0 0 1 1154,498 V596 A12,12 0 0 1 1142,608 H404 A12,12 0 0 1 392,596 V498 A12,12 0 0 1 404,486 Z" /><text x="420" y="525" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#00A6A6">关键含义</text><text x="420" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">在途请求提前占用FIFO容量，保证每个AXI响应到达时都有可写槽位。</text><text x="420" y="586" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">只支持深度1/2和有序响应，不引入重排缓冲或复杂AXI ID。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">代码：hw/rtl/cp/VX_cp_fetch.sv</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">10 / 15</text></g>
