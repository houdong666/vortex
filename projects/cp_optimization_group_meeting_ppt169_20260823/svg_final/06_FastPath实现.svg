ll="#00A6A6" /><path fill="#00A6A6" fill-opacity="0.14" stroke="#00A6A6" d="M916,338 H1066 A10,10 0 0 1 1076,348 V402 A10,10 0 0 1 1066,412 H916 A10,10 0 0 1 906,402 V348 A10,10 0 0 1 916,338 Z" /><text x="991" y="382" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" fill="#0B1F3A">RETIRE</text></g>
