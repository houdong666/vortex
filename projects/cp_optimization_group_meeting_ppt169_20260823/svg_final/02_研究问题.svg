  </g><text x="216" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">如何证明没有副作用？</text><text x="216" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">用顺序、seqnum、Ring wrap、边界与压力回归守住语义。</text></g><g id="question-4"><path fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1" d="M68,532 H1212 A12,12 0 0 1 1224,544 V612 A12,12 0 0 1 1212,624 H68 A12,12 0 0 1 56,612 V544 A12,12 0 0 1 68,532 Z" /><text x="82" y="589" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#F59E0B">04</text>
