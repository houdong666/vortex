er"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：results/exp05/packing_metrics.csv</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">09 / 15</text></g>
