<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">现有实验把后续研究推进到多队列与组合优化</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">RESEARCH IMPACT</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="roadmap"><g id="research-stage-0"><rect x="56" y="150" width="348" height="218" rx="12" fill="#FFFFFF" stroke="#138A5B" stroke-width="1"/><circle cx="108" cy="198" r="28" fill="#138A5B" fill-opacity="0.14"/><use data-icon="chunk-filled/checkmark" x="92" y="182" width="32" height="32" fill="#138A5B"/><text x="86" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#138A5B">已完成：单队列前端</text><text x="86" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937"><tspan x="86" y="292">Fast Path</tspan><tspan x="86" y="322">Packing · Prefetch</tspan></text><line x1="404" y1="259" x2="446" y2="259" stroke="#0B1F3A" stroke-width="3"/><polygon points="446,259 434,252 434,266" fill="#0B1F3A"/></g><g id="research-stage-1"><rect x="452" y="150" width="348" height="218" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><circle cx="504" cy="198" r="28" fill="#F59E0B" fill-opacity="0.14"/><use data-icon="chunk-filled/git-branch" x="488" y="182" width="32" height="32" fill="#F59E0B"/><text x="482" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#F59E0B">近期：共享资源公平性</text><text x="482" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937"><tspan x="482" y="292">Priority Arbitration</tspan><tspan x="482" y="322">Aging · EVENT_WAIT</tspan></text><line x1="800" y1="259" x2="842" y2="259" stroke="#0B1F3A" stroke-width="3"/><polygon points="842,259 830,252 830,266" fill="#0B1F3A"/></g><g id="research-stage-2"><rect x="848" y="150" width="348" height="218" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/><circle cx="900" cy="198" r="28" fill="#1565C0" fill-opacity="0.14"/><use data-icon="chunk-filled/target" x="884" y="182" width="32" height="32" fill="#1565C0"/><text x="878" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1565C0">系统级：端到端验证</text><text x="878" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937"><tspan x="878" y="292">Multi-Queue</tspan><tspan x="878" y="322">QMD · XRT · SimX/RTL Parity</tspan></text></g></g>
  <g id="research-assets"><rect x="56" y="404" width="1168" height="204" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="84" y="447" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">对后续研究最重要的不是三个开关，而是已经建立的实验资产</text><g id="asset-0"><rect x="84" y="476" width="246" height="102" rx="8" fill="#1565C0" fill-opacity="0.08"/><text x="102" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1565C0">指标体系</text><text x="102" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937"><tspan x="102" y="542">CPC</tspan><tspan x="102" y="565">流量、等待、PPA</tspan></text></g><g id="asset-1"><rect x="362" y="476" width="246" height="102" rx="8" fill="#00A6A6" fill-opacity="0.08"/><text x="380" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#00A6A6">可调模型</text><text x="380" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937"><tspan x="380" y="542">AXI latency</tspan><tspan x="380" y="565">FIFO depth</tspan></text></g><g id="asset-2"><rect x="640" y="476" width="246" height="102" rx="8" fill="#138A5B" fill-opacity="0.08"/><text x="658" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#138A5B">正确性框架</text><text x="658" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937"><tspan x="658" y="542">seqnum</tspan><tspan x="658" y="565">顺序、边界、回绕</tspan></text></g><g id="asset-3"><rect x="918" y="476" width="246" height="102" rx="8" fill="#F59E0B" fill-opacity="0.08"/><text x="936" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F59E0B">组合假设</text><text x="936" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937"><tspan x="936" y="542">Packing降低流量，Prefetch隐藏剩余延迟</tspan><tspan x="936" y="565"></tspan></text></g></g>