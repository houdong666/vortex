  <g id="rigor"><path fill="#FFFFFF" stroke="#D64545" stroke-width="1" d="M818,354 H1212 A12,12 0 0 1 1224,366 V600 A12,12 0 0 1 1212,612 H818 A12,12 0 0 1 806,600 V366 A12,12 0 0 1 818,354 Z" /><text x="834" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#D64545">实验三带来的严谨性约束</text><text fill="#1F2937" font-size="17" font-family="Microsoft YaHei, Arial, sans-serif" x="834" y="438">DMA尾拍WSTRB修复已被边界测试证明；</text><text fill="#1F2937" font-size="17" font-family="Microsoft YaHei, Arial, sans-serif" x="834" y="471">但单元测试没有完整Ring取指链路，</text><text fill="#1F2937" font-size="17" font-family="Microsoft YaHei, Arial, sans-serif" x="834" y="504">因此不能直接宣称“冲掉命令Ring”。</text><text x="834" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1F3A">结论必须与验证现场的能力边界一致。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：实验2性能基线、实验3 DMA边界验证</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">05 / 15</text></g>
