<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F4F7FA"/></g>
  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">统一实验方法：先证明正确，再讨论性能</text><rect x="1080" y="34" width="144" height="30" rx="15" fill="#1565C0" fill-opacity="0.10"/><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">METHOD</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1"/></g>
  <g id="pipeline"><g id="stage-1"><rect x="56" y="176" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><circle cx="88" cy="208" r="18" fill="#1565C0"/><text x="88" y="215" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><text x="80" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">Baseline</text><text x="80" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">周期、流量、等待</text><line x1="252" y1="249" x2="288" y2="249" stroke="#00A6A6" stroke-width="3"/><polygon points="288,249 276,242 276,256" fill="#00A6A6"/></g><g id="stage-2"><rect x="292" y="176" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><circle cx="324" cy="208" r="18" fill="#1565C0"/><text x="324" y="215" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><text x="316" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">定位</text><text x="316" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">锁定可解释瓶颈</text><line x1="488" y1="249" x2="524" y2="249" stroke="#00A6A6" stroke-width="3"/><polygon points="524,249 512,242 512,256" fill="#00A6A6"/></g><g id="stage-3"><rect x="528" y="176" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><circle cx="560" cy="208" r="18" fill="#1565C0"/><text x="560" y="215" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text><text x="552" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">实现</text><text x="552" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">参数化RTL/Runtime</text><line x1="724" y1="249" x2="760" y2="249" stroke="#00A6A6" stroke-width="3"/><polygon points="760,249 748,242 748,256" fill="#00A6A6"/></g><g id="stage-4"><rect x="764" y="176" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><circle cx="796" cy="208" r="18" fill="#1565C0"/><text x="796" y="215" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text><text x="788" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">验证</text><text x="788" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">边界、压力、回归</text><line x1="960" y1="249" x2="996" y2="249" stroke="#00A6A6" stroke-width="3"/><polygon points="996,249 984,242 984,256" fill="#00A6A6"/></g><g id="stage-5"><rect x="1000" y="176" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/><circle cx="1032" cy="208" r="18" fill="#F59E0B"/><text x="1032" y="215" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text><text x="1024" y="254" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">决策</text><text x="1024" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B677A">性能 × PPA × 场景</text></g></g>
  <g id="metrics"><rect x="56" y="354" width="720" height="258" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><text x="84" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">统一指标</text><g id="metric-0"><use data-icon="chunk-filled/gauge-high" x="88" y="420" width="28" height="28" fill="#1565C0"/><text x="130" y="441" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937">性能</text><text x="232" y="441" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5B677A">CPC · Cmd/Cycle</text></g><g id="metric-1"><use data-icon="chunk-filled/database" x="88" y="463" width="28" height="28" fill="#00A6A6"/><text x="130" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937">流量</text><text x="232" y="484" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5B677A">Fetch CL · Bytes/Command</text></g><g id="metric-2"><use data-icon="chunk-filled/shield-check" x="88" y="506" width="28" height="28" fill="#138A5B"/><text x="130" y="527" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937">正确性</text><text x="232" y="527" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5B677A">seqnum · drop · duplicate</text></g><g id="metric-3"><use data-icon="chunk-filled/clock" x="88" y="549" width="28" height="28" fill="#D64545"/><text x="130" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937">代价</text><text x="232" y="570" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5B677A">FPGA LC · ASIC area · Fmax</text></g></g>
  <g id="rigor"><rect x="806" y="354" width="418" height="258" rx="12" fill="#FFFFFF" stroke="#D64545" stroke-width="1"/><text x="834" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#D64545">实验三带来的严谨性约束</text><text x="834" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937"><tspan x="834" y="438">DMA尾拍WSTRB修复已被边界测试证明；</tspan><tspan x="834" y="471">但单元测试没有完整Ring取指链路，</tspan><tspan x="834" y="504">因此不能直接宣称“冲掉命令Ring”。</tspan></text><text x="834" y="558" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1F3A">结论必须与验证现场的能力边界一致。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：实验2性能基线、实验3 DMA边界验证</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">05 / 15</text></g>
</svg>
