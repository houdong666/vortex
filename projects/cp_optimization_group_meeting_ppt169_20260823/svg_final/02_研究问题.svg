  </g><text x="216" y="339" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">瓶颈究竟在哪里？</text><text x="216" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5B677A">区分固定状态开销、Fetch带宽浪费与Host AXI等待。</text></g><g id="question-3"><path fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1" d="M68,416 H1212 A12,12 0 0 1 1224,428 V496 A12,12 0 0 1 1212,508 H68 A12,12 0 0 1 56,496 V428 A12,12 0 0 1 68,416 Z" /><text x="82" y="473" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#138A5B">03</text>
