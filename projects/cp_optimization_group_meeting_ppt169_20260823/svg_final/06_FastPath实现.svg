  </g><text x="84" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">为什么做？</text><text fill="#1F2937" font-size="18" font-family="Microsoft YaHei, Arial, sans-serif" x="84" y="252">NOP不申请KMU、DMA、DCR</text><text fill="#1F2937" font-size="18" font-family="Microsoft YaHei, Arial, sans-serif" x="84" y="282">或Event资源，DECODE只承担</text><text fill="#1F2937" font-size="18" font-family="Microsoft YaHei, Arial, sans-serif" x="84" y="312">固定的一周期状态跳转。</text><text x="84" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#F59E0B">机会：直接退休简单命令</text></g>
