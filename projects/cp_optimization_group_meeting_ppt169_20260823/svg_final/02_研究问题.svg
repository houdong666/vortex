  <g id="header"><text x="56" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">这项研究要回答四个问题</text><path fill="#1565C0" fill-opacity="0.10" d="M1095,34 H1209 A15,15 0 0 1 1224,49 V49 A15,15 0 0 1 1209,64 H1095 A15,15 0 0 1 1080,49 V49 A15,15 0 0 1 1095,34 Z" /><text x="1152" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0">RESEARCH QUESTIONS</text><line x1="56" y1="82" x2="1224" y2="82" stroke="#D7DEE8" stroke-width="1" /></g>
  <g id="thesis"><path fill="#1565C0" fill-opacity="0.08" d="M64,104 H1216 A8,8 0 0 1 1224,112 V150 A8,8 0 0 1 1216,158 H64 A8,8 0 0 1 56,150 V112 A8,8 0 0 1 64,104 Z" /><text x="80" y="139" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F3A">优化不是“改RTL”，而是建立瓶颈 → 机制 → 证据 → 决策的完整闭环</text></g>
  <g id="question-1"><path fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1" d="M68,184 H1212 A12,12 0 0 1 1224,196 V264 A12,12 0 0 1 1212,276 H68 A12,12 0 0 1 56,264 V196 A12,12 0 0 1 68,184 Z" /><text x="82" y="241" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="700" fill="#1565C0">01</text>
