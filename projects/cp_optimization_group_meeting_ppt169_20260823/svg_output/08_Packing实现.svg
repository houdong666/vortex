  <g id="semantics"><rect x="400" y="486" width="824" height="122" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="1"/><use data-icon="chunk-filled/code" x="428" y="520" width="34" height="34" fill="#1565C0"/><text x="480" y="535" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#1565C0">cp_tail_</text><text x="630" y="535" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">每Flush一条CL增加64B</text><text x="480" y="574" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#00A6A6">cp_expected_seqnum_</text><text x="710" y="574" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2937">每加入一条命令增加1</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">实现：sw/runtime/common/device.cpp 与 vortex2_internal.h</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">08 / 15</text></g>
