  <g id="decision-principle"><path fill="#F59E0B" fill-opacity="0.12" d="M66,578 H1214 A10,10 0 0 1 1224,588 V642 A10,10 0 0 1 1214,652 H66 A10,10 0 0 1 56,642 V588 A10,10 0 0 1 66,578 Z" /><text x="82" y="622" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">工程原则：参数化保留优化能力，比不加区分地默认开启更可靠。</text></g><g id="footer"><text x="56" y="696" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">来源：实验4与实验6模块级Yosys/OpenSTA PPA代理结果</text><text x="1224" y="696" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8A94A6">13 / 15</text></g>
